name: Build Local CRM Agent

on:
  push:
    branches: [release]
    paths:
      - 'tools/local-CRM-Agent/src/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content 'tools/local-CRM-Agent/src/LocalCrmAgent/LocalCrmAgent.csproj')
          $version = $xml.Project.PropertyGroup.Version
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        shell: bash
        run: |
          if gh release view "local-agent-v${{ steps.version.outputs.VERSION }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release local-agent-v${{ steps.version.outputs.VERSION }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        # Bake the shared agent token into the binary from a repo secret so reps
        # never enter it. If the secret is unset the property is empty and the
        # agent falls back to its setup dialog / CRM_AGENT_TOKEN env var.
        run: dotnet publish tools/local-CRM-Agent/src/LocalCrmAgent/LocalCrmAgent.csproj -c Release -o publish -p:AgentDefaultToken="$env:AGENT_DEFAULT_TOKEN"
        env:
          AGENT_DEFAULT_TOKEN: ${{ secrets.AGENT_SHARED_TOKEN }}

      - name: Create tool.json
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          @{
            id = "local-crm-agent"
            name = "Local CRM Agent"
            description = "Desktop agent that monitors Zoom Phone call state and serves signals to the CRM dashboard."
            type = "windows-app"
            version = "${{ steps.version.outputs.VERSION }}"
            executable = "LocalCrmAgent.exe"
            processName = "LocalCrmAgent"
            autoStart = $true
            registryAutoStart = @{ key = "LocalCrmAgent"; args = "--background" }
            protocolHandler = "crm-agent"
            startMenuFolder = "TableTurnerr"
            startMenuName = "CRM Agent"
          } | ConvertTo-Json -Depth 3 | Set-Content publish/tool.json

      - name: Package
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          Copy-Item tools/local-CRM-Agent/install.bat publish/
          Copy-Item tools/local-CRM-Agent/uninstall.bat publish/
          Compress-Archive -Path publish/* -DestinationPath "LocalCrmAgent-v${{ steps.version.outputs.VERSION }}.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: local-agent-v${{ steps.version.outputs.VERSION }}
          name: Local CRM Agent v${{ steps.version.outputs.VERSION }}
          body: |
            Automated release of Local CRM Agent v${{ steps.version.outputs.VERSION }}.

            **New users:** Download the zip, extract, and run `install.bat`.
            **Existing users:** The agent will auto-update within the hour.
          files: LocalCrmAgent-v${{ steps.version.outputs.VERSION }}.zip
