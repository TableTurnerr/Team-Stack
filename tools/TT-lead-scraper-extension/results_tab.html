<!DOCTYPE html>
<html>
<head>
  <title>TableTurner Lead Scraper - Live Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      color: #202124;
      margin: 0;
    }

    .page-header {
      background: linear-gradient(135deg, #1557b0 0%, #1a73e8 60%, #4285f4 100%);
      padding: 18px 28px 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .page-header-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.22);
      flex-shrink: 0;
    }
    .page-header-title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
    .page-header-sub { font-size: 13px; opacity: 0.82; margin-top: 2px; }

    .page-body { padding: 22px 28px; }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      padding: 14px 18px;
      background: white;
      border-radius: 10px;
      border: 1.5px solid #e2e5eb;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border: none;
      color: white;
      background: #1a73e8;
      cursor: pointer;
      transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .button:hover {
      background: #1558c0;
      box-shadow: 0 2px 8px rgba(26,115,232,0.28);
      transform: translateY(-1px);
    }
    .button:active { transform: translateY(0); box-shadow: none; }

    .button.red-btn { background: #ea4335; }
    .button.red-btn:hover { background: #c5221f; box-shadow: 0 2px 8px rgba(234,67,53,0.28); }

    .stats {
      color: #5f6368;
      font-size: 13px;
      font-weight: 500;
      margin-left: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #e2e5eb;
      background: white;
    }
    th, td {
      border: 1px solid #e2e5eb;
      padding: 10px 12px;
      font-size: 12.5px;
    }
    th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
      background: #f1f3f4;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 11px;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    td { color: #3c4043; }
    tbody tr:hover td { background: #f8f9fa; }
    tbody tr:nth-child(even) td { background: #fafafa; }
    tbody tr:nth-child(even):hover td { background: #f1f3f4; }

    td a { color: #1a73e8; text-decoration: none; }
    td a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page-header">
    <img src="icon.png" class="page-header-logo" alt="TableTurner">
    <div>
      <div class="page-header-title">TableTurner &mdash; Live Results</div>
      <div class="page-header-sub">Scraped leads, updated in real time</div>
    </div>
  </div>

  <div class="page-body">
    <div class="controls">
      <button id="exportBtn" class="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download CSV
      </button>
      <span id="stats" class="stats">Loading...</span>
    </div>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Note</th>
          <th>Closed Status</th>
          <th>Rating</th>
          <th>Reviews</th>
          <th>Phone</th>
          <th>Industry</th>
          <th>Expensiveness</th>
          <th>City</th>
          <th>Address</th>
          <th>Website</th>
          <th>Insta Search</th>
          <th>Google Maps Link</th>
          <th>CRM Status</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script src="results_tab.js"></script>
</body>
</html>
