name: Build Lead Scraper Extension

on:
  push:
    branches: [release]
    paths:
      - 'tools/TT-lead-scraper-extension/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(jq -r '.version' tools/TT-lead-scraper-extension/manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "lead-scraper-v${{ steps.version.outputs.VERSION }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release lead-scraper-v${{ steps.version.outputs.VERSION }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tool.json
        if: steps.check.outputs.exists == 'false'
        run: |
          cat > tools/TT-lead-scraper-extension/tool.json << EOF
          {
            "id": "lead-scraper",
            "name": "TableTurner Lead Scraper",
            "description": "Chrome extension for lead generation with CRM integration.",
            "type": "chrome-extension",
            "version": "${{ steps.version.outputs.VERSION }}"
          }
          EOF

      - name: Package extension
        if: steps.check.outputs.exists == 'false'
        run: |
          cd tools/TT-lead-scraper-extension
          zip -r "../../TT-lead-scraper-v${{ steps.version.outputs.VERSION }}.zip" . -x "README.md" ".git/*"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lead-scraper-v${{ steps.version.outputs.VERSION }}
          name: Lead Scraper Extension v${{ steps.version.outputs.VERSION }}
          body: |
            Automated release of TableTurner Lead Scraper Extension v${{ steps.version.outputs.VERSION }}.

            **Install:** Download the zip, extract, go to `chrome://extensions`, enable Developer Mode, click "Load unpacked" and select the extracted folder.
            **Existing users:** You'll get an update notification in Chrome. Download the zip, extract over your existing folder, and reload the extension.
          files: TT-lead-scraper-v${{ steps.version.outputs.VERSION }}.zip
